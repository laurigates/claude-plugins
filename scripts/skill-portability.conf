# Identifier config for scripts/check-skill-portability.sh (#3308).
#
# [identifiers] -- one Python regex per line. Each names something specific to
# this marketplace's maintainer: a repository under the maintainer's account,
# a process that only exists there, or a local checkout layout. A fork or
# another maintainer replaces this list with their own identifiers.
#
# [allow] -- path<TAB>matched text<TAB>reason. A line that is accepted as
# written: provenance a reader will not act on, a published default the user
# can override, or a test fixture. Every occurrence of the matched text in that
# file passes. Hits waiting for the per-plugin sweep live in
# scripts/skill-portability-baseline.txt instead, not here.
#
# The rule behind both lists is .claude/rules/skill-portability.md.

[identifiers]
laurigates/(gitops|dotfiles|homebrew-tap|shore-recon|loractl|\.github)
\bgitops (repo|flag)
~/repos/

[allow]
