# Identifier config for scripts/check-skill-portability.sh (#3308).
#
# [identifiers] -- one Python regex per line. Each names something specific to
# this marketplace's maintainer: a repository under the maintainer's account,
# a process that only exists there, or a local checkout layout. A fork or
# another maintainer replaces this list with their own identifiers.
#
# [allow] -- path<TAB>matched text<TAB>reason. A line that is accepted as
# written: provenance a reader will not act on, a published default the user
# can override, or a test fixture. Every occurrence of the matched text in that
# file passes. Hits waiting for the per-plugin sweep live in
# scripts/skill-portability-baseline.txt instead, not here.
#
# The rule behind both lists is .claude/rules/skill-portability.md.

[identifiers]
laurigates/(gitops|dotfiles|homebrew-tap|shore(?:line)?-recon|loractl|\.github)
\bgitops (repo|flag)
~/repos/

[allow]
git-plugin/skills/git-merge-hazards/references/serial-merge-chain.md	laurigates/dotfiles	dated incident evidence (which repo the merge chain broke in); nothing to act on
git-plugin/skills/git-merge-hazards/references/sync-notes.md	laurigates/dotfiles	provenance; the sentence itself says the recipe is the author's own and not a command a consumer has
git-plugin/skills/github-pr-title/merge-strategies.md	laurigates/.github	a published reusable workflow named as one overridable default, and an issue citation as provenance for the release-please parser bug
comfyui-plugin/skills/comfyui-node-scaffold/scaffold.py	laurigates/.github	WORKFLOWS_REPO_DEFAULT: published reusable-workflow repo, overridable with --workflows-repo
configure-plugin/skills/configure-reusable-workflows/SKILL.md	laurigates/.github	published reusable-workflow repo, named in Step 3 as the default a project can replace with its own copy
configure-plugin/skills/configure-reusable-workflows/REFERENCE.md	laurigates/.github	caller templates for the published reusable-workflow repo; SKILL.md Step 3 names it as an overridable default
configure-plugin/skills/configure-completions/REFERENCE.md	laurigates/shore-recon	provenance: a public worked example cited for reading, not a repository the skill acts on
agent-patterns-plugin/skills/meta-context-diet/references/anti-patterns.md	laurigates/loractl	evidence citation for the read-the-destination-first rule; a public PR to read, nothing to act on
agent-patterns-plugin/skills/parallel-agent-dispatch/references/worktree-hazards.md	laurigates/loractl	provenance for an observed incident (which project it happened in); nothing to act on
