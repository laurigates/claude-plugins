# Fleet sync policy for the FoundryVTT modules generated by `scaffold.py`.
#
# `scripts/check-fleet-drift.py` compares the files the scaffold emits against
# every generated module and reports drift in BOTH directions (#2761). It is the
# foundry sibling of `comfyui-plugin`'s checker; a shared core is deferred until
# both exist and the common part is clear (decision on #2761, option C).
#
# WHY A REPORT AND NOT A SYNC SCRIPT
# ----------------------------------
# Drift is bidirectional. A module can be AHEAD of the template (Renovate bumps
# a pin, a fix lands where it hurt) or BEHIND it (the template gained a gate the
# module predates). An automatic template -> module apply would silently revert
# the first kind across every module, so the checker reports and a human or
# agent lands the fix on whichever side is behind.
#
# POLICIES
# --------
#   managed  Template is authoritative for byte-identity. Any divergence is an
#            ERROR to reconcile — in EITHER direction. It does not mean
#            "overwrite the module".
#   seed     Template is only a starting point. Never compared.
#   shared   Must be consistent ACROSS MODULES, but the fleet leads and the
#            template back-ports. A module differing from the fleet majority is
#            a WARN; a strict-majority consensus that differs from the template
#            is a BACKPORT signal. When the largest group is only a plurality
#            the file is reported as SHARED_SPLIT, which prescribes no
#            direction (#2756).
#   absent   The path must exist in NO module, and the scaffold must not emit
#            it. Presence in a module is an ERROR; an `absent` entry for a path
#            the scaffold emits is a POLICY_PROBLEM ERROR.
#
# COMPLETENESS
# ------------
# The checker derives the context-invariant template set by importing
# `scaffold.py` and rendering `build_file_map` for every variant and two
# distinct module names; a path is kept only when it renders under both names
# with one identical body. Every such path must appear below: a template with
# no entry is itself an ERROR, so this manifest cannot silently fall behind the
# scaffold.
#
# CLASSIFICATION STATUS
# ---------------------
# These classifications were set when the checker landed (2026-11), from the
# templates and the ComfyUI fleet's measured precedent, WITHOUT a sweep of the
# live module fleet. The first real run is the measurement: review each entry
# against it sceptically before acting on a row (see
# .claude/rules/generated-fleet-drift.md).

version = 1

# --------------------------------------------------------------------------- #
# managed — template authoritative; drift is an ERROR
# --------------------------------------------------------------------------- #

[files."tests/manifest.test.ts"]
policy = "managed"
reason = "The finishing-pass gate each module's own CI runs: one module id across module.json / vite.config.ts / src/constants.ts, esmodules naming the emitted file, install URLs resolving to the release assets. A module carrying a weaker copy ships the drift class this gate exists to catch."

[files."tsconfig.json"]
policy = "managed"
reason = "Strict TS compiler settings. Divergence means one module typechecks under weaker rules."

[files."biome.json"]
policy = "managed"
reason = "Lint/format rules and the biome schema URL, which carries the version pinned in package.json. A module AHEAD here is usually a Renovate bump to roll out, not one to revert."

[files."vitest.config.ts"]
policy = "managed"
reason = "Vitest harness (environment, setup file, include globs). Divergence changes what a module's tests can see."

[files."renovate.json"]
policy = "managed"
reason = "Per-repo config read by the account-wide Renovate App. Divergence silently changes which dependencies Renovate manages in one module."

# --------------------------------------------------------------------------- #
# shared — the fleet leads, the template back-ports
# --------------------------------------------------------------------------- #

[files.".gitignore"]
policy = "shared"
reason = "Modules legitimately APPEND module-specific entries, so byte-identity would be a permanent false ERROR. Fleet consistency is the invariant (ComfyUI precedent, #2494)."

[files.".gitattributes"]
policy = "shared"
reason = "Fleet consistency, not template identity: a module may add linguist or binary entries for assets it ships (ComfyUI precedent, #2494)."

# --------------------------------------------------------------------------- #
# seed — template is a starting point only; never compared
# --------------------------------------------------------------------------- #

[files.".github/workflows/ci.yml"]
policy = "seed"
reason = "Per-module extension point: a module adds jobs (an e2e run against the harness, a pack build). The ComfyUI fleet measured 10 legitimate shapes across 13 packs."

[files.".release-please-manifest.json"]
policy = "seed"
reason = "Holds the module's LIVE released version. The template ships 0.1.0, so a managed policy would ERROR on every released module forever."

[files."src/foundry-shims.d.ts"]
policy = "seed"
reason = "Loose local ambient types for the Foundry globals a module touches. Each module extends them for the API it actually uses, so divergence is expected growth, not drift."

[files."tests/setup.ts"]
policy = "seed"
reason = "Stubs the Foundry globals for Vitest. A module extends the stubs as its tests reach more of the API."

[files."src/patches.ts"]
policy = "seed"
reason = "libwrapper variant only, and the module's own patch logic once implemented (the scaffold ships a Token._draw example). Basic and app modules do not have it."

# --------------------------------------------------------------------------- #
# absent — must exist in no module
# --------------------------------------------------------------------------- #

[files.".github/workflows/renovate.yml"]
policy = "absent"
reason = "A repo-local Renovate runner duplicates the account-wide autodiscover Renovate App under a second bot identity, so the repo keeps two Dependency Dashboard issues forever (#2708). The scaffold stopped emitting it; modules generated before that fix still carry it."
