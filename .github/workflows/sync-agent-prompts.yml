name: "Sync: agent prompts"

# Regenerates the extracted agent CLIs' pre-compiled subagent prompts from this
# repo's plugin skills and opens a PR on each standalone repo
# (git-repo-agent: issue #1017; vault-agent: issue #1973).
#
# Both agents now live in their own repos, but their compilers read plugin
# SKILL.md files from this monorepo (git-repo-agent ADR-009; vault-agent
# ADR-0005/ADR-0006). The pre-compiled artifacts under
# src/<module>/prompts/generated/ are shipped in the wheel, so they must be
# refreshed here (where the plugin sources live) and pushed to the standalone
# repo whenever an upstream skill changes.
#
# LAYOUT (load-bearing): both compilers resolve the plugin sources as
# `Path(__file__).../<repo root>/..` — i.e. the plugins checkout must be the
# PARENT of the agent checkout. That constraint is directory-name agnostic: it
# needs *some* direct child, not one named after the agent. This workflow
# satisfies it by leaving claude-plugins at $GITHUB_WORKSPACE and checking the
# agent out at $GITHUB_WORKSPACE/_standalone. Do not add a `path:` to the first
# checkout, and keep the second one a direct child of the workspace root.
#
# Cross-repo push authenticates as the laurigates-prompt-sync GitHub App, whose
# credentials gitops pushes here (PROMPT_SYNC_CLIENT_ID variable +
# PROMPT_SYNC_PRIVATE_KEY secret; gitops repositories.tf `prompt_sync = true`).
# The App is installed on git-repo-agent and vault-agent ONLY — never on this
# repo — and the token below is scoped by `repositories:` to the single target
# repo of ITS OWN matrix row, so a row can neither write here nor reach the
# other agent. That per-row scoping is load-bearing: it is the only thing
# keeping the two syncs credentially isolated now that they share one workflow.
#
# The App token is minted only when there is drift to push. Both agent repos are
# public, so the read-only checkout below runs on the default GITHUB_TOKEN and a
# no-op run never requests App credentials. Use the `force` dispatch input to
# re-exercise the token path when there is no drift — without it a no-drift run
# skips every push step and exits green, which is indistinguishable from a broken
# token. That matters because the `*/skills/*/SKILL.md` filter is repo-wide:
# most triggering pushes touch a skill neither compiler bundles, so no-drift runs
# are the common case and a broken token is correspondingly less obvious.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Open the sync PR even if the compiled prompts are unchanged (verifies the App token path)."
        type: boolean
        default: false
  push:
    branches: [main]
    # `*` does not match `/` in an Actions path filter, so `*/skills/*/SKILL.md`
    # matches exactly one leading path segment — every plugin's skills, and
    # nothing deeper. Both agents' bundles are subsets of that.
    #
    # The compilers themselves used to be listed here too. They moved into the
    # standalone repos with the rest of the CLIs (#1017, #1973), so a compiler
    # change is now the standalone repo's own CI concern; re-run this workflow by
    # dispatch after one lands if the output shape changed.
    paths:
      - '*/skills/*/SKILL.md'

permissions:
  contents: read

jobs:
  sync:
    # Orchestration only (scripts + `gh`) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      # Required: one agent's sync failing must not cancel the other's.
      fail-fast: false
      matrix:
        include:
          - agent: git-repo-agent
            module: git_repo_agent
          - agent: vault-agent
            module: vault_agent
    # Bare group per matrix row, no ref suffix: each row force-pushes the fixed
    # `sync/generated-prompts` branch on ITS target repo with
    # `delete-branch: true`, so overlapping push+dispatch runs would race that
    # branch. Never cancelled mid-write. The `matrix.agent` suffix keeps the two
    # targets in separate groups — they target different repos and must not
    # serialise against each other, exactly as the two pre-merge workflows'
    # distinct groups guaranteed.
    concurrency:
      group: sync-agent-prompts-${{ matrix.agent }}
      cancel-in-progress: false
    steps:
      # No `path:` — the compilers require this checkout to be the PARENT of the
      # agent checkout below. See the LAYOUT note in the header.
      - name: Checkout claude-plugins
        uses: actions/checkout@v6

      # Read-only, on the default GITHUB_TOKEN: both agent repos are public, so
      # a no-drift run never mints App credentials. `persist-credentials: false`
      # keeps this token out of the local git config, so the push below uses the
      # App token and nothing else.
      - name: Checkout the standalone agent repo
        uses: actions/checkout@v6
        with:
          repository: laurigates/${{ matrix.agent }}
          path: _standalone
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Runs the STANDALONE repo's compiler against this repo's skills, writing
      # into the standalone checkout. Its own PLUGINS_ROOT = <repo>/.. resolves
      # to $GITHUB_WORKSPACE, where claude-plugins sits.
      - name: Regenerate compiled prompts
        run: uv run --project _standalone python _standalone/scripts/compile_prompts.py

      - name: Detect changes
        id: diff
        # git status --porcelain, not git diff --quiet: a NEW skill added to the
        # compiler's bundle map emits a new UNTRACKED per-skill fragment, which
        # `git diff` cannot see — the sync would silently skip it.
        env:
          FORCE: ${{ inputs.force }}
          GENERATED_DIR: src/${{ matrix.module }}/prompts/generated/
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced: exercising the token path for $GENERATED_DIR regardless of drift." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$(git -C _standalone status --porcelain -- "$GENERATED_DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Minted only when there is something to push, so a no-op run never
      # requests a token. `repositories:` narrows the installation token to the
      # single target repo of this matrix row.
      #
      # app-id, not client-id: v3 marks `app-id` deprecated in favour of
      # `client-id`, but actionlint v1.7.12 (the latest release, pinned in
      # .pre-commit-config.yaml and plugin-pr-checks.yml) has stale metadata for
      # this action and rejects `client-id` as an undefined input. A numeric App
      # ID is a valid JWT issuer, so this works; gitops pushes
      # PROMPT_SYNC_CLIENT_ID alongside for the coordinated swap (gitops#206).
      - name: Mint a prompt-sync App token for the target agent
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PROMPT_SYNC_APP_ID }}
          private-key: ${{ secrets.PROMPT_SYNC_PRIVATE_KEY }}
          owner: laurigates
          repositories: ${{ matrix.agent }}

      - name: Open sync PR on the standalone agent repo
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: _standalone
          token: ${{ steps.app-token.outputs.token }}
          branch: sync/generated-prompts
          delete-branch: true
          commit-message: "chore: sync compiled prompts from claude-plugins"
          title: "chore: sync compiled prompts from claude-plugins"
          body: |
            Regenerated `src/${{ matrix.module }}/prompts/generated/` from the
            upstream plugin skills in laurigates/claude-plugins.

            Automated by `.github/workflows/sync-agent-prompts.yml`.
