name: "Plugin: Stranded-work audit"

# Finds commits that exist on a remote branch but never reached the default branch.
#
# Deliberately a scheduled sweep rather than a `pull_request: closed` workflow. Two
# reasons, both learned the hard way (see scripts/check-stranded-work.sh):
#
#   1. Reacting to the auto-close is a race already lost — by the time the event
#      fires GitHub has deleted the base ref, and a PR whose base is gone cannot be
#      reopened. An event handler could only ever file a replacement, same as this.
#   2. An event workflow needs a caller file in every repo, and it never fires at all
#      for a branch that was pushed without a PR — the shape this sweep exists to catch.
#
# Runs on this repo by default; pass --repo to the script to sweep siblings from here.

on:
  schedule:
    - cron: '07 8 * * 1'  # Mondays 08:07 UTC (off-the-hour: :00 is the scheduler surge)
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Grace period before a never-PR'd branch counts as stranded"
        required: false
        default: '7'

permissions:
  contents: read
  issues: write

# Bare group, no ref suffix: serialises an overlapping cron + workflow_dispatch so
# the check-then-create-issue window below cannot race. Never cancel a run that
# may be mid-write.
concurrency:
  group: stranded-work-audit
  cancel-in-progress: false

jobs:
  stranded-work:
    # Orchestration only (scripts + `gh`) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Job-level so the value is in the runner environment the composite action's
    # steps inherit; the `script` input below expands it in its own shell.
    env:
      MIN_AGE_DAYS: ${{ inputs.min_age_days || '7' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # `git cherry` needs full history to detect patch-equivalence

      # The script emits nothing when clean, so a clean sweep files no issue.
      #
      # This job previously had NO label-provisioning step, unlike every other
      # audit — `stranded-work` was the one label a `gh issue create --label`
      # could still hard-fail on. Routing through the composite provisions it
      # with `gh label create --force` (idempotent, and a real auth failure
      # still fails the step).
      - name: Stranded-work audit
        uses: ./.github/actions/script-to-issue
        with:
          label: stranded-work
          color: fbca04
          description: Commits stranded on a branch that never reached the default branch
          script: bash scripts/check-stranded-work.sh --issue-body --min-age-days "$MIN_AGE_DAYS"
          title: 'Stranded work: branches that never reached main ({date})'
          assignee: laurigates
