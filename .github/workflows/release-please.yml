name: "Release: release-please"

on:
  push:
    branches:
      - main
  # Allow manual triggering, e.g. after fix-release-conflicts closes a stale PR
  workflow_dispatch: {}

# Prevent concurrent runs from racing on the release-please branch.
# cancel-in-progress: false ensures queued runs wait rather than being
# cancelled — avoids a race where two runs both try to update CHANGELOG.md.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      # `releases_created` was exposed here but consumed by nothing — job outputs
      # are file-local and no job in this workflow referenced it. Dropped.
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # Behaviour change (deliberate): `continue-on-error: true` was removed from
      # this step. It sat on the CORE release-please action, so any failure left
      # the job GREEN with an empty `prs_created`, and the downstream
      # sync-release-pr / enable-auto-merge jobs silently skipped — the whole
      # release pipeline no-opped with a checkmark. A broken release must be red.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Ensure labels on release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Apply labels via gh CLI as fallback for API eventual consistency
          gh pr list --repo "${{ github.repository }}" \
            --state open \
            --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' | \
          while read -r pr_number; do
            if [ -n "$pr_number" ]; then
              gh pr edit "$pr_number" --repo "${{ github.repository }}" \
                --add-label "autorelease: pending" 2>/dev/null || true
            fi
          done

  enable-auto-merge:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [release-please, sync-release-pr]
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Enable auto-merge for release PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get open release-please PRs by branch name pattern
          gh pr list --repo ${{ github.repository }} \
            --state open \
            --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' | \
          while read -r pr_number; do
            if [ -n "$pr_number" ]; then
              echo "Enabling auto-merge for PR #$pr_number"
              gh pr merge "$pr_number" --repo ${{ github.repository }} --auto --squash
            fi
          done

  # Sync marketplace.json versions to release-please PRs before they merge
  # This ensures the marketplace.json update is included in the release PR itself
  sync-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Get release PR branch
        id: get-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get the most recent release-please PR
          PR_DATA=$(gh pr list --repo ${{ github.repository }} \
            --state open \
            --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | {number, branch: .headRefName}' \
            | head -1)

          if [ -n "$PR_DATA" ]; then
            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
            PR_BRANCH=$(echo "$PR_DATA" | jq -r '.branch')
            {
              echo "pr_number=$PR_NUMBER"
              echo "pr_branch=$PR_BRANCH"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.get-pr.outputs.found == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.get-pr.outputs.pr_branch }}

      - name: Sync plugin config files
        if: steps.get-pr.outputs.found == 'true'
        run: |
          python3 scripts/sync-plugin-configs.py --fix

      - name: Check for changes
        if: steps.get-pr.outputs.found == 'true'
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to release PR
        if: steps.get-pr.outputs.found == 'true' && steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync marketplace.json versions"

          # PUSHED sentinel: under `bash -e` a failing `&&` list does NOT abort
          # the script, and the loop's last command is `sleep` (exit 0), so
          # exhausting all three attempts used to fall through GREEN.
          PUSHED=false
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ steps.get-pr.outputs.pr_branch }}" && git push; then
              PUSHED=true
              echo "::notice::Synced marketplace.json versions and pushed to the release PR"
              break
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 2))
          done

          if [ "$PUSHED" != true ]; then
            echo "::error::Marketplace sync committed locally but all 3 push attempts to the release PR failed."
            exit 1
          fi
