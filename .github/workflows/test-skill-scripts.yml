name: "Test: Skill scripts"

# Runs the skill-local regression tests that ship next to a skill's extracted
# scripts (**/skills/**/scripts/tests/test-*.sh), the plugin hook regression
# suites (*/hooks/test-*.sh — bash-antipatterns, branch-protection, …), AND the
# repo-root guard self-tests (scripts/tests/test-*.sh, #2333), matching what
# scripts/run-skill-script-tests.sh discovers. Mirrors the per-path-trigger
# shape of plugin-enablement-drift.yml so it fires only when skill scripts, hook
# scripts, generator templates, or the runner itself change — independent of
# plugin-pr-checks.yml, which gates the SKILL.md / compliance surface.
#
# The install steps below are load-bearing, not conveniences: each one exists so
# a specific gate ACTUALLY RUNS here instead of taking its SKIP branch. The
# tests that depend on them are declared in scripts/required-to-run-tests.txt,
# where a skip is an error rather than a silent green (#2221).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/skills/**/scripts/**'
      - '*-plugin/scripts/**'
      - '*-plugin/schemas/**'
      - '*-plugin/hooks/**'
      # Generator templates live OUTSIDE skills/ (foundryvtt-plugin/templates/
      # foundryvtt-module/), so a PR editing only the template — precisely what
      # the parity gate exists to catch — matched no trigger (#2221). Kept
      # generic: other plugins will grow template directories too.
      - '*-plugin/templates/**'
      # `scripts/**`, not the former per-file list: the runner now discovers
      # repo-root `scripts/tests/test-*.sh` too (#2333), so a PR changing only
      # `scripts/check-foo.sh` + its self-test must fire this workflow or the
      # newly-discovered guard still gets no CI signal — the exact gap the
      # discovery fix exists to close. Subsumes every `scripts/...` entry that
      # used to be enumerated here.
      - 'scripts/**'
      - '*-plugin/hooks.json'
      - 'justfile'
      - '.github/workflows/test-skill-scripts.yml'
  push:
    branches: [main]
    paths:
      - '**/skills/**/scripts/**'
      - '*-plugin/scripts/**'
      - '*-plugin/schemas/**'
      - '*-plugin/hooks/**'
      - '*-plugin/templates/**'
      - 'scripts/**'

concurrency:
  group: test-skill-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=cargo-generate/cargo-generate extractVersion=^v(?<version>.*)$
  CARGO_GENERATE_VERSION: "0.23.14"
  # renovate: datasource=github-releases depName=GothenburgBitFactory/taskwarrior extractVersion=^v(?<version>.*)$
  TASKWARRIOR_VERSION: "3.4.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ast-grep powers the code-antipatterns / code-hidden-failures rule-project
      # regression tests (issue #2010). Absent, those tests SKIP; installed, the
      # `ast-grep test` fixture gate actually runs in CI. Pinned to match the
      # version the fixtures were authored against.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.43.0

      # blueprint-plugin/scripts/check-manifest-schema.py is a self-contained
      # `uv run` PEP723 script (jsonschema). Absent uv, its regression suite
      # SKIPs; installed, the manifest-schema gate actually runs in CI (#2136).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # cargo-generate powers the foundryvtt-module-scaffold template-parity
      # acceptance gate — it runs scaffold.py and the cargo-generate port of it
      # over the same inputs and requires byte-identical trees. Absent, that
      # test SKIPs; installed, the gate actually runs (#2221).
      #
      # Prebuilt release binary, NOT `cargo install cargo-generate --locked`:
      # the from-source build compiles several hundred crates and costs minutes
      # on every run, for one test. Upstream publishes no checksum file
      # alongside these assets, so the pinned version tag is the anchor —
      # Renovate keeps it fresh via the customManager in renovate.json.
      #
      # `-gnu`, not `-musl`: upstream ships musl for aarch64 only, so the
      # x86_64 musl URL 404s (caught by this workflow's first real run). If the
      # runner ever moves to arm64, the target triple has to move with it.
      - name: Restore cached cargo-generate
        id: cargo-generate-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cargo-generate
          key: cargo-generate-${{ env.CARGO_GENERATE_VERSION }}-linux-x86_64

      - name: Install cargo-generate
        if: steps.cargo-generate-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          tmp_dir="$(mktemp -d)"
          curl -fsSL -o "$tmp_dir/cargo-generate.tar.gz" \
            "https://github.com/cargo-generate/cargo-generate/releases/download/v${CARGO_GENERATE_VERSION}/cargo-generate-v${CARGO_GENERATE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$tmp_dir/cargo-generate.tar.gz" -C "$HOME/.local/bin" cargo-generate
          rm -rf "$tmp_dir"

      # taskwarrior powers two EXECUTABLE semantic gates that had never run here:
      # taskwarrior-plugin/skills/task-add/.../test-uuid-capture.sh and
      # taskwarrior-plugin/scripts/tests/test-task-id-stability.sh. The first one
      # exists specifically because a SYNTACTIC guard — a grep for the literal
      # `task +LATEST _get uuid` — let a non-working command ship (#1417/#1819):
      # `_get` is a DOM accessor that returns empty when handed a tag filter. The
      # executable test was the fix for that class, so leaving it unrun defeats
      # its purpose (#2221).
      #
      # Built from source, unlike cargo-generate above, because there is no
      # prebuilt to download: the v3.4.2 release carries exactly one uploaded
      # asset, the `task-3.4.2.tar.gz` SOURCE tarball, plus GitHub's two
      # auto-generated source archives. `apt-get install taskwarrior` is not an
      # option either — ubuntu-24.04 universe pins 2.6.2, and these skills
      # document Taskwarrior 3.x, so a 2.x gate could read green on guidance
      # that is broken for every real user.
      #
      # ~4 minutes cold on a 4-vCPU runner (C++ plus the Rust taskchampion
      # crate), which is why it is cached on the version tag; a warm run restores
      # one binary in ~1s (56 MB unstripped, 17 MB in the cache — `strip` only
      # takes it to 39 MB, so it is not worth a step). The tag is the only
      # integrity anchor — upstream
      # publishes no checksum file — and Renovate keeps it fresh via the
      # workflow-env customManager in renovate.json.
      - name: Restore cached taskwarrior
        id: taskwarrior-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/task
          key: taskwarrior-${{ env.TASKWARRIOR_VERSION }}-linux-x86_64

      - name: Build taskwarrior
        if: steps.taskwarrior-cache.outputs.cache-hit != 'true'
        run: |
          # cmake, g++ and the Rust toolchain are already on the runner image;
          # uuid-dev is the one header package the configure step probes for
          # ("Looking for libuuid"), and it is cheap enough not to gamble on.
          sudo apt-get update -qq
          sudo apt-get install -y -qq uuid-dev
          mkdir -p "$HOME/.local/bin"
          tmp_dir="$(mktemp -d)"
          git clone --depth 1 --branch "v${TASKWARRIOR_VERSION}" \
            https://github.com/GothenburgBitFactory/taskwarrior.git "$tmp_dir/src"
          cmake -S "$tmp_dir/src" -B "$tmp_dir/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$tmp_dir/build" -j"$(nproc)"
          install -m 0755 "$tmp_dir/build/src/task" "$HOME/.local/bin/task"
          rm -rf "$tmp_dir"

      - name: Put installed tools on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-generate" --version
          "$HOME/.local/bin/task" --version

      - name: Regression-test the skill-script runner's SKIP accounting
        run: bash scripts/tests/test-run-skill-script-tests.sh

      # Exits 1 when a test fails OR when a test named in
      # scripts/required-to-run-tests.txt SKIPs — the installs above exist so
      # those gates run, and a silent skip made the log read green (#2221).
      - name: Run skill-local regression tests
        run: bash scripts/run-skill-script-tests.sh

      - name: Smoke-test the OpenCode config generator
        run: bash scripts/tests/test-configure-opencode.sh

      - name: Regression-test the OpenCode skill-name rewrite
        run: bash scripts/tests/test-rewrite-skill-name-to-dir.sh

      - name: Regression-test the OpenCode hook-plugin export
        run: bash scripts/tests/test-export-opencode-hooks.sh
