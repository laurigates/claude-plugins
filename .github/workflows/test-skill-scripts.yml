name: "Test: Skill scripts"

# Runs the skill-local regression tests that ship next to a skill's extracted
# scripts (**/skills/**/scripts/tests/test-*.sh) AND the plugin hook regression
# suites (*/hooks/test-*.sh — bash-antipatterns, branch-protection, …), matching
# what scripts/run-skill-script-tests.sh discovers. Mirrors the per-path-trigger
# shape of plugin-enablement-drift.yml so it fires only when skill scripts, hook
# scripts, generator templates, or the runner itself change — independent of
# plugin-pr-checks.yml, which gates the SKILL.md / compliance surface.
#
# The install steps below are load-bearing, not conveniences: each one exists so
# a specific gate ACTUALLY RUNS here instead of taking its SKIP branch. The
# tests that depend on them are declared in scripts/required-to-run-tests.txt,
# where a skip is an error rather than a silent green (#2221).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/skills/**/scripts/**'
      - '*-plugin/scripts/**'
      - '*-plugin/schemas/**'
      - '*-plugin/hooks/**'
      # Generator templates live OUTSIDE skills/ (foundryvtt-plugin/templates/
      # foundryvtt-module/), so a PR editing only the template — precisely what
      # the parity gate exists to catch — matched no trigger (#2221). Kept
      # generic: other plugins will grow template directories too.
      - '*-plugin/templates/**'
      - 'scripts/run-skill-script-tests.sh'
      - 'scripts/required-to-run-tests.txt'
      - 'scripts/configure-opencode.sh'
      - 'scripts/install-opencode-ocx.sh'
      - 'scripts/install-opencode.sh'
      - 'scripts/export-opencode.sh'
      - 'scripts/rewrite-skill-name-to-dir.py'
      - 'scripts/generate-opencode-hook-plugins.py'
      - 'scripts/tests/test-configure-opencode.sh'
      - 'scripts/tests/test-rewrite-skill-name-to-dir.sh'
      - 'scripts/tests/test-export-opencode-hooks.sh'
      - 'scripts/tests/test-run-skill-script-tests.sh'
      - '*-plugin/hooks.json'
      - 'justfile'
      - '.github/workflows/test-skill-scripts.yml'
  push:
    branches: [main]
    paths:
      - '**/skills/**/scripts/**'
      - '*-plugin/scripts/**'
      - '*-plugin/schemas/**'
      - '*-plugin/hooks/**'
      - '*-plugin/templates/**'
      - 'scripts/run-skill-script-tests.sh'
      - 'scripts/required-to-run-tests.txt'
      - 'scripts/configure-opencode.sh'

concurrency:
  group: test-skill-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=cargo-generate/cargo-generate extractVersion=^v(?<version>.*)$
  CARGO_GENERATE_VERSION: "0.23.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ast-grep powers the code-antipatterns / code-hidden-failures rule-project
      # regression tests (issue #2010). Absent, those tests SKIP; installed, the
      # `ast-grep test` fixture gate actually runs in CI. Pinned to match the
      # version the fixtures were authored against.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.43.0

      # blueprint-plugin/scripts/check-manifest-schema.py is a self-contained
      # `uv run` PEP723 script (jsonschema). Absent uv, its regression suite
      # SKIPs; installed, the manifest-schema gate actually runs in CI (#2136).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # cargo-generate powers the foundryvtt-module-scaffold template-parity
      # acceptance gate — it runs scaffold.py and the cargo-generate port of it
      # over the same inputs and requires byte-identical trees. Absent, that
      # test SKIPs; installed, the gate actually runs (#2221).
      #
      # Prebuilt release binary, NOT `cargo install cargo-generate --locked`:
      # the from-source build compiles several hundred crates and costs minutes
      # on every run, for one test. Upstream publishes no checksum file
      # alongside these assets, so the pinned version tag is the anchor —
      # Renovate keeps it fresh via the customManager in renovate.json.
      - name: Restore cached cargo-generate
        id: cargo-generate-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cargo-generate
          key: cargo-generate-${{ env.CARGO_GENERATE_VERSION }}-linux-x86_64

      - name: Install cargo-generate
        if: steps.cargo-generate-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          tmp_dir="$(mktemp -d)"
          curl -fsSL -o "$tmp_dir/cargo-generate.tar.gz" \
            "https://github.com/cargo-generate/cargo-generate/releases/download/v${CARGO_GENERATE_VERSION}/cargo-generate-v${CARGO_GENERATE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$tmp_dir/cargo-generate.tar.gz" -C "$HOME/.local/bin" cargo-generate
          rm -rf "$tmp_dir"

      - name: Put cargo-generate on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-generate" --version

      - name: Regression-test the skill-script runner's SKIP accounting
        run: bash scripts/tests/test-run-skill-script-tests.sh

      # Exits 1 when a test fails OR when a test named in
      # scripts/required-to-run-tests.txt SKIPs — the installs above exist so
      # those gates run, and a silent skip made the log read green (#2221).
      - name: Run skill-local regression tests
        run: bash scripts/run-skill-script-tests.sh

      - name: Smoke-test the OpenCode config generator
        run: bash scripts/tests/test-configure-opencode.sh

      - name: Regression-test the OpenCode skill-name rewrite
        run: bash scripts/tests/test-rewrite-skill-name-to-dir.sh

      - name: Regression-test the OpenCode hook-plugin export
        run: bash scripts/tests/test-export-opencode-hooks.sh
