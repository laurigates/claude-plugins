name: "Release: Clear autorelease labels"

# Thin caller for the org reusable workflow. See
# laurigates/.github/.github/workflows/reusable-clear-autorelease-labels.yml
# for what this does and when to run it (manual escape hatch for a clogged
# release-please pipeline).

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label to strip from closed PRs"
        default: "autorelease: pending"
        required: false
      dry_run:
        description: "List matches without removing the label"
        type: boolean
        default: false

# Explicit top-level least-privilege grant. Without one, a second job added here
# would silently inherit the repo-default token scope instead of this set.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Bare group, no ref suffix: this strips labels off closed PRs, so two
# concurrent dispatch runs would fight over the same set. Never cancelled
# mid-write.
concurrency:
  group: clear-autorelease-labels
  cancel-in-progress: false

jobs:
  clear-labels:
    uses: laurigates/.github/.github/workflows/reusable-clear-autorelease-labels.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      label: ${{ inputs.label }}
      dry_run: ${{ inputs.dry_run }}
