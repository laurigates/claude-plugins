name: "Release: PR documentation audit"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# release-please force-pushes its PR branch on every re-run; only the newest
# head's verdict matters, so a newer push supersedes the in-flight run.
concurrency:
  group: release-pr-doc-audit-${{ github.event.pull_request.number || github.ref }}
  # Safe to cancel although the job posts a comment: the comment is found by its
  # marker and edited in place, so a superseded run cannot leave a duplicate.
  cancel-in-progress: true

jobs:
  doc-audit:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The four release documentation checks (CHANGELOG format, version
      # consistency, skill date freshness, blueprint compliance) are mechanical,
      # so a script runs them on every release-PR head. It posts one
      # `## Release Documentation Check` comment and edits it on later pushes.
      # This replaced an Opus run on every release-please push (86 completed and
      # 95 cancelled between 2026-09-24 and 2026-10-24, $0.40-0.70 each in the
      # six sampled runs); the Claude fallback was removed in #3205.
      - name: Deterministic release documentation check
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          REPORT: ${{ github.workspace }}/.release-doc-check.md
        run: |
          rc=0
          python3 scripts/release-pr-doc-audit.py --base "origin/${BASE_REF}" --out "$REPORT" \
            > "$RUNNER_TEMP/release-doc-check.txt" || rc=$?
          cat "$RUNNER_TEMP/release-doc-check.txt"
          if [ "$rc" -gt 1 ]; then
            echo "::warning::The release documentation check could not run (exit ${rc})."
            echo "failures=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failures=$(sed -n 's/^FAILURES=//p' "$RUNNER_TEMP/release-doc-check.txt")" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"

      # One comment per release PR: the marker finds this workflow's earlier
      # comment, which is edited instead of adding a new one per force-push.
      - name: Post the deterministic check
        if: steps.check.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- release-pr-doc-check -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${REPORT}" > /dev/null
            echo "Updated comment ${id}."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          fi

      # A ❌ row, or a check that could not run, fails the job so the release PR
      # shows a red check. This runs after the comment is posted, so the report
      # still lands on the PR when a row fails.
      - name: Fail on a failing or unrunnable check
        if: steps.check.outputs.failures != '0'
        env:
          FAILURES: ${{ steps.check.outputs.failures }}
        run: |
          if [ "$FAILURES" = "unknown" ] || [ -z "$FAILURES" ]; then
            echo "::error title=Release documentation check could not run::scripts/release-pr-doc-audit.py exited with a usage or git error; see the check step's log."
          else
            echo "::error title=Release documentation check failed::${FAILURES} check row(s) reported ❌; see the '## Release Documentation Check' comment on this PR."
          fi
          exit 1
