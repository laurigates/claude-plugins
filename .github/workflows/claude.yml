name: "Claude: @mentions"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Prevent concurrent Claude runs on the same issue/PR
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    # The ONLY bound on an @mention run: --max-turns is deliberately absent
    # below so interactive conversations stay open-ended, which leaves nothing
    # else to stop a runaway invocation.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Interactive @mention work — pin opus explicitly (effort is the cost
          # lever, see .claude/rules/workflow-model-effort.md). No --max-turns:
          # interactive conversations must stay open-ended.
          #
          # NO --allowedTools, deliberately. This input previously held a
          # Claude tool list in `additional_permissions:`, which takes a GitHub
          # permissions MAP ("actions: read") -- so that sandbox was never
          # applied and this job has always run unrestricted. The honest fix
          # here is to drop the pretense, not to relocate it:
          #
          #   - The real trust boundary is upstream. claude-code-action runs
          #     checkWritePermissions on the actor for every entity context
          #     (prepare.ts) and throws otherwise, so only someone who already
          #     holds repo write can trigger this at all. A tool list adds
          #     little against an actor who could push directly.
          #   - The `plugins:` block below loads 22 plugins. Their skills invoke
          #     the whole toolchain -- uv, pytest, ruff, npm, bun, cargo,
          #     pre-commit, ast-grep, rg, jq, kubectl, d2 and more. Granting
          #     Skill/SlashCommand while denying those commands loads 22 plugins
          #     and disarms every one of them: "@claude run the tests and fix
          #     the failure" would deny its way through the 30-minute timeout,
          #     since there is no --max-turns to fail fast against.
          #   - Any list broad enough to keep them working is broad enough to be
          #     meaningless -- a second decorative sandbox, which is the exact
          #     defect this change set exists to remove.
          #
          # The residual risk is real but unchanged from today: a maintainer
          # @mentioning Claude on issue text carrying injected instructions. A
          # permissive allowlist would not stop that either; what would is
          # narrowing the job `permissions:` block above, which is a separate
          # decision with its own blast radius.
          #
          # Every OTHER Claude workflow in this repo has a fixed prompt and a
          # real --allowedTools boundary. This one is the documented exception.
          #
          # One flag per line: scripts/check-workflow-model.sh matches
          # `--model`/`--effort` anchored at line start in a folded scalar.
          claude_args: >-
            --model opus
            --effort medium
          # The job-level `actions: read` grant above never reached Claude's
          # token while this input held a tool list; passed as a real map it
          # becomes live. Kept rather than dropped because "@claude why did CI
          # fail?" is a routine @mention on a PR.
          additional_permissions: |
            actions: read
          plugin_marketplaces: |
            https://github.com/laurigates/claude-plugins.git
          plugins: |
            blueprint-plugin@laurigates-claude-plugins
            configure-plugin@laurigates-claude-plugins
            git-plugin@laurigates-claude-plugins
            testing-plugin@laurigates-claude-plugins
            code-quality-plugin@laurigates-claude-plugins
            python-plugin@laurigates-claude-plugins
            typescript-plugin@laurigates-claude-plugins
            tools-plugin@laurigates-claude-plugins
            rust-plugin@laurigates-claude-plugins
            kubernetes-plugin@laurigates-claude-plugins
            terraform-plugin@laurigates-claude-plugins
            github-actions-plugin@laurigates-claude-plugins
            documentation-plugin@laurigates-claude-plugins
            project-plugin@laurigates-claude-plugins
            agent-patterns-plugin@laurigates-claude-plugins
            accessibility-plugin@laurigates-claude-plugins
            bevy-plugin@laurigates-claude-plugins
            container-plugin@laurigates-claude-plugins
            api-plugin@laurigates-claude-plugins
            communication-plugin@laurigates-claude-plugins
            agents-plugin@laurigates-claude-plugins
            hooks-plugin@laurigates-claude-plugins
