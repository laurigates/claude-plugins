name: Renovate

on:
  schedule:
    # Avoid the top of the hour to reduce GitHub Actions scheduling congestion,
    # which was causing scheduled runs to be delayed and fail with startup_failure.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run mode'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'full'
          - 'lookup'
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn

# Explicit least-privilege grant. A called workflow cannot escalate above its
# caller, and a caller `permissions:` block sets every UNLISTED scope to `none` —
# so this must mirror the reusable's own declaration exactly. Verified against
# laurigates/.github at authoring time.
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  renovate:
    uses: laurigates/.github/.github/workflows/reusable-renovate.yml@main
    with:
      dry-run: ${{ inputs.dryRun || 'false' }}
      log-level: ${{ inputs.logLevel || 'info' }}
