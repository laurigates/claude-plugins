name: "Release: Fix release-please conflicts"

on:
  push:
    branches: [main]
  schedule:
    # Offset from the top of the hour to avoid scheduling congestion that
    # caused scheduled runs to fail with startup_failure.
    - cron: "23,53 * * * *"
  workflow_dispatch: {}

# Explicit least-privilege grant. A called workflow cannot escalate above its
# caller, and a caller `permissions:` block sets every UNLISTED scope to `none` —
# so this must mirror the reusable's own declaration exactly. Verified against
# laurigates/.github at authoring time.
permissions:
  contents: write
  pull-requests: write
  actions: write

# Bare group, no ref suffix: this fires twice hourly AND on every push to main,
# so two runs can rewrite the same release-please branch at once — conflict
# repair manufacturing the conflicts it exists to fix. Never cancelled mid-write.
concurrency:
  group: fix-release-conflicts
  cancel-in-progress: false

jobs:
  fix-conflicts:
    uses: laurigates/.github/.github/workflows/reusable-fix-release-conflicts.yml@main
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
