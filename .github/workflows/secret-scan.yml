name: "PR: Secret scan"

# Deterministic secret scan of every PR's commits with gitleaks. Before this
# workflow nothing in CI ran gitleaks or `pre-commit run`, and GitHub secret
# scanning is off for this repo, so the pre-commit hook on a developer machine
# was the only scan — and it loaded zero rules (see the canary step).
#
# No `paths:` filter and no bot gate: Renovate and release-please PRs are
# scanned too, and a scan of a small PR is one short job on a slim runner.
# Not a required check.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bumped together with the gitleaks rev in .pre-commit-config.yaml and
  # scripts/install_pkgs.sh (the `gitleaks` group in renovate.json).
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The scan walks origin/<base>..HEAD, so the base branch history
          # must be present.
          fetch-depth: 0

      - name: Install gitleaks
        # Verified against the checksums file of the same release. That
        # catches a corrupted or swapped asset, not a compromised release.
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$tarball" "$base/$tarball"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Prove the gitleaks config detects a planted key
        # A .gitleaks.toml with an [allowlist] but neither
        # `[extend] useDefault = true` nor [[rules]] loads zero rules, and
        # gitleaks never prints a rule count, so the scan below would pass any
        # secret. This repo's config was that shape until useDefault was added.
        # The key is generated at run time so no literal key sits in this file;
        # GITLEAKS_CONFIG makes this check and the scan read the same config.
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            echo "GITLEAKS_CONFIG=$PWD/.gitleaks.toml" >> "$GITHUB_ENV"
            export GITLEAKS_CONFIG="$PWD/.gitleaks.toml"
          fi
          canary="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$canary"
          rand=$(head -c 20 /dev/urandom | base32)
          printf 'aws_access_key_id = "AKIA%s"\n' "${rand:0:16}" > "$canary/canary.env"
          rc=0
          gitleaks dir "$canary" --no-banner --redact --exit-code 3 >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "::error file=.gitleaks.toml::The gitleaks config did not detect a planted AWS key (exit ${rc}). Add '[extend] useDefault = true' or [[rules]]."
            exit 1
          fi
          echo "Canary detected: the config loads rules."

      - name: Scan the PR's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rc=0
          gitleaks git --no-banner --redact --verbose \
            --log-opts="origin/${BASE_REF}..HEAD" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks reported a secret in this PR's commits (exit ${rc}). The redacted finding is in the log above. A false positive goes in the .gitleaks.toml allowlist."
            exit 1
          fi
