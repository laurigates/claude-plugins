name: "Sync: vault-agent prompts"

# Regenerates vault-agent's pre-compiled subagent prompts from this repo's
# obsidian-plugin skills and opens a PR on laurigates/vault-agent (issue #1973).
#
# vault-agent was extracted into its own repo but its compiler reads plugin
# SKILL.md files from this monorepo (vault-agent ADR-0005/ADR-0006). The
# pre-compiled artifacts under vault-agent/src/vault_agent/prompts/generated/
# are shipped in the wheel, so they must be refreshed here (where the plugin
# sources live) and pushed to the standalone repo whenever an upstream skill
# changes.
#
# Cross-repo push authenticates as the laurigates-prompt-sync GitHub App, whose
# credentials gitops pushes here (PROMPT_SYNC_CLIENT_ID variable +
# PROMPT_SYNC_PRIVATE_KEY secret; gitops repositories.tf `prompt_sync = true`).
# The App is installed on git-repo-agent and vault-agent ONLY — never on this
# repo — and the token below is scoped by `repositories:` to vault-agent alone,
# so it can neither write here nor reach git-repo-agent.
#
# The `push:` trigger below is live. Verify with the `force` dispatch input
# rather than a plain dispatch: vault-agent's artifacts are often already
# current, and a no-drift run skips every step and exits green — which is
# indistinguishable from a broken token. `force` mints the token and checks
# out the target regardless, so the credential path is actually exercised.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Mint the token and check out the target even if the compiled prompts are unchanged (verifies the App token path)."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'obsidian-plugin/skills/*/SKILL.md'
      - 'vault-agent/scripts/compile_prompts.py'
      - 'vault-agent/src/vault_agent/prompts/compiler.py'

permissions:
  contents: read

jobs:
  sync:
    # Orchestration only (scripts + `gh`) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    steps:
      - name: Checkout claude-plugins
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Regenerate compiled prompts
        run: uv run --project vault-agent python vault-agent/scripts/compile_prompts.py

      - name: Detect changes
        id: diff
        # git status --porcelain, not git diff --quiet: a NEW skill added to
        # SUBAGENT_SKILLS emits a new UNTRACKED per-skill fragment, which
        # `git diff` cannot see — the sync would silently skip it.
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo 'Forced: exercising the token path regardless of drift.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$(git status --porcelain -- vault-agent/src/vault_agent/prompts/generated/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Minted only when there is something to push, so a no-op run never
      # requests a token. `repositories:` narrows the installation token to the
      # single target repo.
      #
      # app-id, not client-id: v3 marks `app-id` deprecated in favour of
      # `client-id`, but actionlint v1.7.12 (the latest release, pinned in
      # .pre-commit-config.yaml and plugin-pr-checks.yml) has stale metadata for
      # this action and rejects `client-id` as an undefined input. A numeric App
      # ID is a valid JWT issuer, so this works; gitops pushes
      # PROMPT_SYNC_CLIENT_ID alongside for the coordinated swap (gitops#206).
      - name: Mint a prompt-sync App token for vault-agent
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PROMPT_SYNC_APP_ID }}
          private-key: ${{ secrets.PROMPT_SYNC_PRIVATE_KEY }}
          owner: laurigates
          repositories: vault-agent

      - name: Checkout vault-agent
        if: steps.diff.outputs.changed == 'true'
        uses: actions/checkout@v6
        with:
          repository: laurigates/vault-agent
          token: ${{ steps.app-token.outputs.token }}
          path: _standalone

      - name: Copy regenerated prompts into the standalone checkout
        if: steps.diff.outputs.changed == 'true'
        run: |
          rsync -a --delete \
            vault-agent/src/vault_agent/prompts/generated/ \
            _standalone/src/vault_agent/prompts/generated/

      - name: Open sync PR on vault-agent
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: _standalone
          token: ${{ steps.app-token.outputs.token }}
          branch: sync/generated-prompts
          delete-branch: true
          commit-message: "chore: sync compiled prompts from claude-plugins"
          title: "chore: sync compiled prompts from claude-plugins"
          body: |
            Regenerated `src/vault_agent/prompts/generated/` from the upstream
            plugin skills in laurigates/claude-plugins.

            Automated by `.github/workflows/sync-vault-agent-prompts.yml`.
