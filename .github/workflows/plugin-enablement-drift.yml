name: "Plugin: Enablement drift"

# Keeps .claude/settings.json `enabledPlugins` in lockstep with the plugins
# published in .claude-plugin/marketplace.json, so the repo always dogfoods its
# full plugin set. Triggers whenever either file changes — adding a plugin to
# the marketplace without enabling it (or leaving a removed plugin enabled)
# fails the check.
#
# The same job validates configure-plugin/policy/repo-baseline.json: every
# plugin key the policy names, and every official LSP name the configure-plugin
# skill docs cite, must resolve to a real plugin (#3318).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.claude/settings.json'
      - 'scripts/check-enabled-plugins-drift.sh'
      - 'scripts/tests/test-check-enabled-plugins-drift.sh'
      - 'configure-plugin/policy/**'
      - 'configure-plugin/skills/**/*.md'
      - 'scripts/check-repo-baseline-policy.sh'
      - 'scripts/tests/test-check-repo-baseline-policy.sh'
      - '.github/workflows/plugin-enablement-drift.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.claude/settings.json'
      - 'configure-plugin/policy/**'

concurrency:
  group: plugin-enablement-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    # Orchestration only (scripts + `gh`) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Self-test the drift guard
        run: bash scripts/tests/test-check-enabled-plugins-drift.sh

      - name: Check plugin enablement drift
        # One invocation, not two: `--strict` only changes the exit code (it
        # gates a single `exit "$exit_severity"`), so the plain run printed a
        # byte-identical report and the pair just doubled the log.
        run: bash scripts/check-enabled-plugins-drift.sh --strict

      - name: Self-test the repo baseline policy guard
        run: bash scripts/tests/test-check-repo-baseline-policy.sh

      - name: Check the repo baseline policy
        run: bash scripts/check-repo-baseline-policy.sh --strict
