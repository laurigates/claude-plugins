        entry: bash ./scripts/tests/test-plugin-compliance-check.sh
        language: system
        files: '^scripts/(plugin-compliance-check\.sh|tests/test-plugin-compliance-check\.sh)$'
        pass_filenames: false
      - id: test-audit-scripts-exit
