        language: script
        files: '^(hooks-plugin/\.claude-plugin/plugin\.json|scripts/check-taskcompleted-verification\.sh)$'
        pass_filenames: false
      - id: test-check-taskcompleted-verification
        name: TaskCompleted verification guard regression
        entry: ./scripts/tests/test-check-taskcompleted-verification.sh
        language: script
        files: '^scripts/(check-taskcompleted-verification\.sh|tests/test-check-taskcompleted-verification\.sh)$'
