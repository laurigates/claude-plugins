repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the pinned `uvx ruff@<version>` steps in
    # plugin-pr-checks.yml — a version skew makes pre-commit and CI disagree
    # about formatting. Config: ruff.toml at the repo root.
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Keep in sync with the actionlint CI step in plugin-pr-checks.yml.
        # No args remain — embedded run-block shellcheck is ON (the 58
        # pre-existing findings were cleaned in #1775), and the former
        # -ignore 'property "result"…' suppression is gone (#1774 removed
        # the audit workflows' outputs.result reads).
  - repo: local
    hooks:
      - id: lint-shell-scripts
        name: shell scripts follow shell-scripting.md (shebang, set flags, block())
        entry: bash ./scripts/lint-shell-scripts.sh
        language: system
        files: '\.sh$'
        pass_filenames: false
      - id: lint-context-commands
        name: lint context commands
        entry: ./scripts/lint-context-commands.sh
        language: script
        files: '(SKILL|skill)\.md$'
        pass_filenames: false
      - id: check-context-command-execution
        name: execute context commands in a bare sandbox (must not abort)
        entry: ./scripts/check-context-command-execution.sh --strict
        language: script
        files: '(SKILL|skill)\.md$'
        exclude: '^\.claude/'
        pass_filenames: true
      - id: check-driver-freshness
        name: check configure-repo driver freshness
        entry: bash ./scripts/check-driver-freshness.sh
        language: system
        files: '(SKILL|skill)\.md$'
        pass_filenames: false
      - id: nudge-plugin-readme-currency
        name: nudge to update a changed plugin's README.md (advisory, never blocks)
        entry: bash ./scripts/check-plugin-readme-currency.sh
        language: system
        files: '^[^/]+-plugin/(skills|agents|\.claude-plugin)/'
        pass_filenames: false
        verbose: true
      - id: test-check-plugin-readme-currency
        name: plugin-README-currency nudge regression
        entry: bash ./scripts/tests/test-check-plugin-readme-currency.sh
        language: system
        files: '^scripts/(check-plugin-readme-currency\.sh|tests/test-check-plugin-readme-currency\.sh)$'
        pass_filenames: false
      - id: check-docs-index
        name: per-plugin skill/agent counts in README/PLUGIN-MAP/diagram match disk
        entry: bash ./scripts/check-docs-index.sh --strict
        language: system
        # `verbose: true` is load-bearing, not decoration. `doc_count_drift` —
        # the finding this entry exists for — is WARN severity, and --strict
        # exits 0 on a WARN (only ERROR sets a non-zero exit). A silent
        # exit-0 hook prints nothing, so without verbose the drift would be
        # detected locally and still never reach the committer. --strict is
        # kept so this entry matches the CI step's severity contract
        # (plugin-pr-checks.yml "Check docs-index drift"): when the hook fires,
        # the six ERROR-severity findings — rule_table_dangling,
        # plugin_map_drift, diagram_node_dangling, diagram_svg_node_missing,
        # diagram_svg_stale, readme_row_dangling — block the commit.
        #
        # Whole-scope guard (pass_filenames: false). The trigger names the
        # paths whose change can move a STATED count: a plugin's skills/,
        # agents/ or .claude-plugin/ (mirroring the nudge-plugin-readme-currency
        # entry above), the three documents that state those counts, and the
        # checker itself. It deliberately does NOT reach every file the verdict
        # depends on — a plugin's own README.md, .claude/rules/*.md, CLAUDE.md,
        # the marketplace and release-please manifests are all outside it, so
        # the ERROR findings rooted in those inputs cannot fire here. This entry
        # narrows the count-drift feedback loop; it is not a local replacement
        # for the CI step, which is ungated and reads the whole surface.
        files: '(^[^/]+-plugin/(skills|agents|\.claude-plugin)/|^README\.md$|^docs/PLUGIN-MAP\.md$|^docs/diagrams/plugin-relationships\.(d2|svg)$|^scripts/check-docs-index\.sh$)'
        pass_filenames: false
        verbose: true
      - id: audit-skill-descriptions
        name: audit skill descriptions for auto-invocation
        entry: python3 ./scripts/audit-skill-descriptions.py --strict-all
        language: system
        files: '(SKILL|skill)\.md$'
        pass_filenames: false
      - id: audit-skill-description-length
        name: audit skill descriptions for listing-budget verbosity (>300 chars)
        entry: python3 ./scripts/audit-skill-descriptions.py --strict-length
        language: system
        files: '(SKILL|skill)\.md$'
        pass_filenames: false
      - id: check-context-engineering
        name: always-loaded context surface stays within budget (C5 ratchet)
        entry: python3 ./scripts/check-context-engineering.py --strict
        language: system
        files: '^(CLAUDE\.md|\.claude/rules/.*\.md|scripts/check-context-engineering\.py|evaluate-plugin/skills/evaluate-context-engineering/scripts/check-context-engineering\.py)$'
        pass_filenames: false
      - id: lint-taskwarrior-tags
        name: lint taskwarrior-plugin docs for hyphenated tag names
        entry: ./scripts/lint-taskwarrior-tags.sh
        language: script
        files: '^taskwarrior-plugin/.*\.md$'
        pass_filenames: false
      - id: check-agent-tool-selection
        name: every plugin agent embeds a Tool Selection section
        entry: ./scripts/check-agent-tool-selection.sh
        language: script
        files: '/agents/.*\.md$'
        pass_filenames: false
      - id: check-agent-model
        name: every plugin agent runs on opus
        entry: ./scripts/check-agent-model.sh
        language: script
        files: '/agents/.*\.md$'
        pass_filenames: false
      - id: check-branch-containment-guidance
        name: branch containment is routed to the authority ladder, not branch-audit
        entry: ./scripts/check-branch-containment-guidance.sh
        language: script
        files: '^([^/]+-plugin/.*\.md|scripts/check-branch-containment-guidance\.sh)$'
        pass_filenames: false
      - id: check-branch-containment-guidance-test
        name: branch-containment guidance lint regression
        entry: ./scripts/tests/test-check-branch-containment-guidance.sh
        language: script
        files: '^scripts/(check-branch-containment-guidance\.sh|tests/test-check-branch-containment-guidance\.sh)$'
        pass_filenames: false
      - id: check-unused-bash-grant
        name: no skill grants Bash without running shell
        entry: ./scripts/check-unused-bash-grant.sh --strict
        language: script
        files: '^([^/]+-plugin/skills/.*/SKILL\.md|scripts/check-unused-bash-grant\.sh)$'
        pass_filenames: false
      - id: check-unused-bash-grant-test
        name: unused-Bash-grant lint regression
        entry: ./scripts/tests/test-check-unused-bash-grant.sh
        language: script
        files: '^scripts/(check-unused-bash-grant\.sh|tests/test-check-unused-bash-grant\.sh)$'
        pass_filenames: false
      # --strict since the corpus reached UNQUALIFIED=0 (see the ratchet note in
      # .claude/rules/regression-testing.md). Without it the WARN tier reached
      # nobody: the hook ran unflagged and non-verbose, and the guard appeared in
      # no workflow at all, so 6 bare names resolved only by plugin-name fallback
      # -- "luck of name resolution", in the script's own header.
      - id: check-golden-set-coverage
        name: golden-set sweep cannot report green on a fraction silently
        entry: bash ./scripts/check-golden-set-coverage.sh
        language: system
        files: '^(evaluate-plugin/golden-set\.json|\.github/workflows/golden-set-evaluation\.yml|scripts/check-golden-set-coverage\.sh|.*/evals\.json)$'
        pass_filenames: false
      - id: test-check-golden-set-coverage
        name: golden-set coverage guard regression
        entry: bash ./scripts/tests/test-check-golden-set-coverage.sh
        language: system
        files: '^scripts/(check-golden-set-coverage\.sh|tests/test-check-golden-set-coverage\.sh)$'
        pass_filenames: false
      - id: check-dead-tool-grants
        name: no retired tool name is granted in allowed-tools/tools
        entry: bash ./scripts/check-dead-tool-grants.sh
        language: system
        files: '\.md$'
        pass_filenames: false
      - id: test-check-dead-tool-grants
        name: dead-tool-grant guard regression
        entry: bash ./scripts/tests/test-check-dead-tool-grants.sh
        language: system
        files: '^scripts/(check-dead-tool-grants\.sh|tests/test-check-dead-tool-grants\.sh)$'
        pass_filenames: false
      - id: check-subagent-types
        name: every subagent_type in a skill body resolves to a real agent
        entry: ./scripts/check-subagent-types.sh --strict
        language: script
        files: '^([^/]+-plugin/(skills/.*\.md|agents/.*\.md)|scripts/check-subagent-types\.sh)$'
        pass_filenames: false
      - id: test-check-subagent-types
        name: subagent_type resolution regression
        entry: bash ./scripts/tests/test-check-subagent-types.sh
        language: system
        files: '^scripts/(check-subagent-types\.sh|tests/test-check-subagent-types\.sh)$'
        pass_filenames: false
      - id: check-unrendered-templates
        name: no unrendered {{ if }} template conditionals in skill bodies (#2265)
        entry: ./scripts/check-unrendered-templates.sh
        language: script
        files: '^([^/]+-plugin/skills/.*\.md|scripts/check-unrendered-templates\.sh)$'
        pass_filenames: false
      - id: test-check-unrendered-templates
        name: unrendered-template-conditional regression
        entry: bash ./scripts/tests/test-check-unrendered-templates.sh
        language: system
        files: '^scripts/(check-unrendered-templates\.sh|tests/test-check-unrendered-templates\.sh)$'
        pass_filenames: false
      - id: check-workflow-model
        name: every Claude workflow pins opus + explicit effort
        entry: ./scripts/check-workflow-model.sh
        language: script
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
      - id: check-workflow-script-triggers
        name: workflow-run scripts are reachable from its path triggers (#2219)
        entry: ./scripts/check-workflow-script-triggers.sh --strict
        language: script
        files: '^(\.github/workflows/.*\.ya?ml|scripts/check-workflow-script-triggers\.sh)$'
        pass_filenames: false
      - id: test-check-workflow-script-triggers
        name: workflow script-trigger guard regression
        entry: ./scripts/tests/test-check-workflow-script-triggers.sh
        language: script
        files: '^scripts/(check-workflow-script-triggers\.sh|tests/test-check-workflow-script-triggers\.sh)$'
