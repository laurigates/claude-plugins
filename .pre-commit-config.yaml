        entry: bash ./scripts/check-research-radar-grounding.sh --strict
        language: system
        files: '(research-radar\.yml|check-research-radar-grounding\.sh)$'
        pass_filenames: false
      - id: test-check-research-radar-grounding
        name: research-radar grounding guard regression
