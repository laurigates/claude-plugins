        entry: bash ./scripts/tests/test-audit-scripts-exit.sh
        language: system
        # agentic-audit-precompute.sh joined the corpus this suite guards (it is
        # registered for exit-0/no-stderr/bounded-find/wall-clock), so the
        # trigger has to reach it too or the guard silently stops guarding.
        files: '^scripts/(blueprint-health-check\.sh|infra-compliance-check\.sh|agentic-audit-precompute\.sh|tests/test-audit-scripts-exit\.sh)$'
        pass_filenames: false
