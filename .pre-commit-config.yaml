      - id: test-guard-worktree-root-discovery
        name: guards still scan from a worktree-shaped root (#2219)
        entry: ./scripts/tests/test-guard-worktree-root-discovery.sh
        language: script
        files: '^scripts/(check-(agent-model|unused-bash-grant|version-pin-coverage|workflow-js-model)\.sh|run-skill-script-tests\.sh|tests/test-guard-worktree-root-discovery\.sh)$'
        pass_filenames: false
      - id: check-auto-resolve-mergeability-poll
        name: auto-resolve-conflicts polls until mergeability settles (#1786)
        entry: ./scripts/check-auto-resolve-mergeability-poll.sh
        language: script
        files: '^\.github/workflows/auto-resolve-conflicts\.ya?ml$'
        pass_filenames: false
      - id: test-check-blueprint-level3-templates
        name: blueprint level-3 template guard regression (#2005)
        entry: bash ./scripts/tests/test-check-blueprint-level3-templates.sh
        language: system
        files: '^(blueprint-plugin/templates/blueprint-(autorun|wo-execute)\.workflow\.yml|scripts/(check-blueprint-level3-templates\.sh|tests/test-check-blueprint-level3-templates\.sh))$'
        pass_filenames: false
      - id: check-blueprint-level3-templates
        name: blueprint level-3 workflow templates carry model/effort + injection + loop-integrity invariants (#2005)
        entry: ./scripts/check-blueprint-level3-templates.sh
        language: script
        files: '^(blueprint-plugin/templates/blueprint-(autorun|wo-execute)\.workflow\.yml|scripts/check-blueprint-level3-templates\.sh)$'
        pass_filenames: false
      - id: test-check-generated-rules-registration
        name: blueprint generated-rules registration contract regression (#2331)
        entry: bash ./blueprint-plugin/scripts/tests/test-check-generated-rules-registration.sh
        language: system
        files: '^blueprint-plugin/(skills/blueprint-(init|generate-rules|sync|promote)/SKILL\.md|hooks/blueprint-drift-probe\.sh|scripts/(check-generated-rules-registration\.sh|register-generated-rules\.sh|tests/test-check-generated-rules-registration\.sh))$'
        pass_filenames: false
      - id: test-register-generated-rules
        name: blueprint generated-rules writer regression (#2331)
        entry: bash ./blueprint-plugin/scripts/tests/test-register-generated-rules.sh
        language: system
        files: '^blueprint-plugin/scripts/(register-generated-rules\.sh|tests/test-register-generated-rules\.sh)$'
        pass_filenames: false
      - id: check-generated-rules-registration
        name: blueprint-init registers what it writes; one key form across producers and consumers (#2331)
        entry: ./blueprint-plugin/scripts/check-generated-rules-registration.sh
        language: script
        files: '^blueprint-plugin/(skills/blueprint-(init|generate-rules|sync|promote)/SKILL\.md|hooks/blueprint-drift-probe\.sh|scripts/(check-generated-rules-registration\.sh|register-generated-rules\.sh))$'
        pass_filenames: false
      - id: test-check-workflow-js-model
        name: bundled workflow .js model/effort guard regression (#2210)
        entry: bash ./scripts/tests/test-check-workflow-js-model.sh
        language: system
        files: '^scripts/(check-workflow-js-model\.sh|tests/test-check-workflow-js-model\.sh)$'
        pass_filenames: false
      - id: check-workflow-js-model
        name: bundled workflow .js agent() calls pin opus + explicit effort and stay reachable (#2210)
        entry: bash ./scripts/check-workflow-js-model.sh --strict
        language: system
        # SKILL.md is in scope because the reachability half of the guard reads
        # the sibling skill's `## Workflow harness (template)` framing section.
        files: '^([^/]+-plugin/skills/[^/]+/(workflows/.*\.js|SKILL\.md)|scripts/check-workflow-js-model\.sh)$'
        pass_filenames: false
      - id: check-agent-failure-contract
        name: dispatch skills carry the loud-failure / completion-manifest contract (#1422, #1601)
        entry: ./scripts/check-agent-failure-contract.sh
        language: script
        files: '^(agent-patterns-plugin/skills/(parallel-agent-dispatch|custom-agent-definitions)/((SKILL|REFERENCE)\.md|references/.*\.md)|agents-plugin/agents/refactor\.md|scripts/check-agent-failure-contract\.sh)$'
        pass_filenames: false
      - id: test-check-agent-failure-contract
        name: completion-manifest contract regression (#1601)
        entry: bash ./scripts/tests/test-check-agent-failure-contract.sh
        language: system
        files: '^scripts/(check-agent-failure-contract\.sh|tests/test-check-agent-failure-contract\.sh)$'
        pass_filenames: false
      - id: check-skill-filename-case
        name: skill files are named SKILL.md (case-sensitive; #1606)
        entry: ./scripts/check-skill-filename-case.sh
        language: script
        files: '(?i)/skills/.*/skill\.md$'
        pass_filenames: false
      - id: check-vault-offline-fallback
        name: obsidian vault-* audit skills document an offline path (#1727)
        entry: ./scripts/check-vault-offline-fallback.sh
        language: script
        files: '^obsidian-plugin/skills/(vault-orphans|vault-wikilinks|vault-mocs|vault-tags|vault-stubs|search-discovery)/SKILL\.md$'
        pass_filenames: false
      - id: lint-mcp-tool-references
        name: lint skill files for references to unavailable MCP tools
        entry: ./scripts/lint-mcp-tool-references.sh
        language: script
        # Must cover every path the walk reads (see the script's COVERAGE
        # header) plus the script itself — a trigger narrower than the scan is
        # the allowlist-drift shape #2164 named.
        files: '(SKILL\.md|skill\.md|REFERENCE\.md|\.workflow\.js|^scripts/lint-mcp-tool-references\.sh)$'
        pass_filenames: false
      - id: test-lint-mcp-tool-references
        name: MCP tool-reference denylist detects, stays narrow, and scans from any cwd (#2437)
        entry: bash ./scripts/tests/test-lint-mcp-tool-references.sh
        language: system
        files: '^(scripts/(lint-mcp-tool-references\.sh|tests/test-lint-mcp-tool-references\.sh)|agent-patterns-plugin/skills/multi-model-delegation/SKILL\.md)$'
        pass_filenames: false
      - id: lint-package-references
        name: lint skill files for references to nonexistent packages (npm/PyPI/crates/etc.)
        entry: ./scripts/lint-package-references.sh
        language: script
        files: '(SKILL\.md|skill\.md|REFERENCE\.md)$'
        pass_filenames: false
      - id: check-dead-api-endpoints
        name: skills and scripts call no retired REST endpoint (#2321)
        entry: ./scripts/check-dead-api-endpoints.sh --strict
        language: script
        # .sh included on purpose — the defect this guards lived in a script,
        # not a doc, where a 410 was swallowed and misreported as a scope error.
        files: '(\.md|\.sh)$'
        pass_filenames: false
      - id: check-dead-api-endpoints-selftest
        name: dead-endpoint guard regression
        entry: ./scripts/tests/test-check-dead-api-endpoints.sh
        language: script
        files: '^scripts/(check-dead-api-endpoints\.sh|tests/test-check-dead-api-endpoints\.sh)$'
        pass_filenames: false
      - id: check-version-pin-coverage
        name: skill version pins are a Renovate-managed shape (version-pinning.md)
        entry: bash ./scripts/check-version-pin-coverage.sh --strict
        language: system
        # The guard scans THREE surfaces, so the trigger must too (#2285):
        # skill markdown, plugin scaffold templates (*-plugin/templates/**,
        # whose pins are judged by PATH against renovate.json's manager
        # patterns), and renovate.json itself (narrowing a pattern there can
        # un-cover a template pin with no other file changing). Matched with
        # `re.search` against repo-relative paths, so `^renovate\.json` pins
        # the root config and leaves a nested one alone.
        files: '(/skills/.*\.md|-plugin/templates/.*|^renovate\.json)$'
        pass_filenames: false
      - id: check-enabled-plugins-drift
        name: enabledPlugins matches the marketplace (plugin-enablement-drift)
        entry: bash ./scripts/check-enabled-plugins-drift.sh --strict
        language: system
        files: '^(\.claude-plugin/marketplace\.json|\.claude/settings\.json)$'
        pass_filenames: false
      - id: check-feature-flags-catalog
        name: every plugin env flag is documented (feature-flags-catalog)
        entry: bash ./scripts/check-feature-flags-catalog.sh --strict
        language: system
        files: '^((hooks-plugin|git-plugin|taskwarrior-plugin)/.*\.sh|taskwarrior-plugin/skills/install-native-hooks/templates/.*|hooks-plugin/docs/feature-flags\.md|scripts/check-feature-flags-catalog\.sh|scripts/tests/test-check-feature-flags-catalog\.sh)$'
        pass_filenames: false
      - id: test-check-feature-flags-catalog
        name: feature-flags catalog guard regression
        entry: bash ./scripts/tests/test-check-feature-flags-catalog.sh
        language: system
        files: '^scripts/(check-feature-flags-catalog\.sh|tests/test-check-feature-flags-catalog\.sh)$'
        pass_filenames: false
      - id: check-configure-components
        name: configure-plugin taxonomy matches components.yaml (manifest/flow/README drift)
        entry: bash ./scripts/check-configure-components.sh --strict
        language: system
        files: '^(configure-plugin/(skills/[^/]+/SKILL\.md|skills/configure-all/components\.yaml|docs/flow\.md|README\.md)|scripts/check-configure-components\.sh)$'
        pass_filenames: false
      - id: test-check-configure-components
        name: configure-components drift guard regression
        entry: bash ./scripts/tests/test-check-configure-components.sh
        language: system
        files: '^(scripts/(check-configure-components\.sh|tests/test-check-configure-components\.sh)|configure-plugin/skills/configure-all/scripts/list-components\.sh)$'
        pass_filenames: false
