<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Glow Tuner</title>
<style>
  :root { --bg: #0a0c10; --panel: #151920; --line: #2a2f3a; --text: #e6e9ef; --muted: #8b93a3; --teal: #14b8a6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1700px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position: relative; line-height: 0; align-self: start; }
  video { width: 100%; display: block; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; mix-blend-mode: screen; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; align-self: start; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 12px; font-size: 12.5px; }
  label { display: block; margin: 10px 0 2px; }
  label span { float: right; color: var(--teal); font-variant-numeric: tabular-nums; }
  label small { display: block; color: var(--muted); font-size: 11.5px; }
  input[type=range] { width: 100%; accent-color: var(--teal); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  select, button { background: #0f1218; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--teal); }
  .jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; max-height: 180px; overflow-y: auto; }
  .jumps button { font-size: 12px; }
  .out { margin-top: 14px; padding: 8px; background: #0f1218; border: 1px solid var(--line); border-radius: 5px;
         font: 12px ui-monospace, Menlo, monospace; word-break: break-word; user-select: all; }
  .meter { height: 6px; background: #0f1218; border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .meter div { height: 100%; width: 0; background: var(--teal); }
</style>
</head>
<body>
<main>
  <div class="stage">
    <video id="v" controls preload="auto"></video>
    <canvas id="c"></canvas>
  </div>
  <aside>
    <h1>Beat glow</h1>
    <p class="hint" id="hint"></p>

    <label>Intensity <span id="o-intensity"></span><small>peak opacity on the strongest beat</small><input id="intensity" type="range" min="0" max="1" step="0.01"></label>
    <label>Width <span id="o-width"></span><small>px at 1920, distance for the glow to fall to 1/e</small><input id="width" type="range" min="5" max="300" step="1"></label>
    <label>Decay <span id="o-decay"></span><small>s for a pulse to fall to 1/e</small><input id="decay" type="range" min="0.05" max="0.8" step="0.01"></label>
    <label>Floor <span id="o-floor"></span><small>steady glow between beats, as a share of the peak</small><input id="floor" type="range" min="0" max="0.6" step="0.02"></label>
    <div class="row">Pulse on
      <select id="every"><option value="1">every beat</option><option value="2">every 2nd</option><option value="4">every 4th</option></select>
      phase <select id="phase"><option>0</option><option>1</option><option>2</option><option>3</option></select>
    </div>
    <div class="row"><label style="margin:0"><input id="kick" type="checkbox"> Follow kick strength</label></div>
    <div class="row"><label style="margin:0"><input id="on" type="checkbox" checked> Glow on</label></div>

    <div class="meter"><div id="meter"></div></div>
    <div class="jumps" id="jumps"></div>
    <div class="out" id="out"></div>
    <div class="row"><button id="copy">Copy settings</button><button id="reset">Reset</button></div>
  </aside>
</main>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const v = $("v"), c = $("c"), ctx = c.getContext("2d");
v.src = DATA.video;
$("hint").textContent = `${DATA.bpm} BPM, ${DATA.beats.length} beats. Play the video and drag the sliders; the glow ` +
  "updates live. When it looks right, copy the line at the bottom back: it is beat_glow.py's options.";
const PIC_H = DATA.height - Math.round(DATA.margin_bottom * DATA.width / 1920);
const MW = Math.min(640, DATA.width), MH = Math.round(PIC_H * MW / DATA.width);  // mask resolution, scaled up by CSS
const K = MW / 1920;                                                              // design px (1920 wide) to mask px
c.width = MW; c.height = MH;
c.style.height = (PIC_H / DATA.height * 100) + "%";

const accent = title => {
  const parts = title.split(DATA.sep), label = (parts.length > 1 ? parts.slice(1).join(DATA.sep) : title).toLowerCase();
  for (const [key, rgb] of DATA.accents) if (label.includes(key)) return rgb;
  return DATA.default;
};
const ids = ["intensity", "width", "decay", "floor", "every", "phase", "kick", "on"];
for (const id of ids.slice(0, 7)) {
  if ($(id).type === "checkbox") $(id).checked = DATA.settings[id]; else $(id).value = DATA.settings[id];
}
const defaults = Object.fromEntries(ids.map(id => [id, $(id).type === "checkbox" ? $(id).checked : $(id).value]));
const val = id => $(id).type === "checkbox" ? $(id).checked : Number($(id).value);
const settings = () => Object.fromEntries(ids.map(id => [id, val(id)]));

// Glow mask: exp(-d / width), d = distance from a pixel centre to the picture's nearest edge (as beat_glow.py).
let tinted = {};
function buildMask() {
  const w = val("width") * K, mask = new Float32Array(MW * MH);
  for (let y = 0; y < MH; y++) {
    const dy = Math.min(y, MH - 1 - y) + 0.5;
    for (let x = 0; x < MW; x++) mask[y * MW + x] = Math.exp(-Math.min(dy, Math.min(x, MW - 1 - x) + 0.5) / w);
  }
  tinted = {};
  for (const [, title] of DATA.chapters.length ? DATA.chapters : [[0, ""]]) {
    const col = accent(title);
    if (tinted[col.join()]) continue;
    const cv = document.createElement("canvas"); cv.width = MW; cv.height = MH;
    const cx = cv.getContext("2d"), img = cx.createImageData(MW, MH);
    for (let i = 0; i < mask.length; i++) {
      img.data[4 * i] = col[0]; img.data[4 * i + 1] = col[1]; img.data[4 * i + 2] = col[2];
      img.data[4 * i + 3] = Math.round(255 * Math.min(1, mask[i]));
    }
    cx.putImageData(img, 0, 0);
    tinted[col.join()] = cv;
  }
}

// BEGIN pulseAt — same envelope as beats.py envelope(): 30 ms rise into each beat, exponential decay after it.
const RISE = 0.03;
function pulseAt(t, beats, s) {
  let p = 0;
  for (let i = 0; i < beats.length; i++) {
    const [tb, strength] = beats[i];
    if (tb < t - 5 * s.decay) continue;
    if (tb > t + RISE) break;
    if ((i - s.phase) % s.every !== 0) continue;
    const dt = t - tb, e = dt < 0 ? Math.max(0, 1 + dt / RISE) : Math.exp(-dt / s.decay);
    p = Math.max(p, e * (s.kick ? strength : 1));
  }
  return s.floor + (1 - s.floor) * p;
}
// END pulseAt

function chapterAt(t) {
  let i = 0;
  while (i + 1 < DATA.chapters.length && DATA.chapters[i + 1][0] <= t) i++;
  return DATA.chapters[i] || [0, ""];
}

function frame() {
  const t = v.currentTime, [, title] = chapterAt(t), s = settings();
  const p = pulseAt(t, DATA.beats, s) * s.intensity;
  ctx.clearRect(0, 0, MW, MH);
  if (s.on && p > 0.005) {
    ctx.globalAlpha = Math.min(1, p);
    ctx.drawImage(tinted[accent(title).join()], 0, 0);
  }
  $("meter").style.width = Math.min(100, p * 100) + "%";
  requestAnimationFrame(frame);
}

function refresh(rebuild) {
  for (const id of ["intensity", "width", "decay", "floor"]) $("o-" + id).textContent = $(id).value;
  const s = settings();
  $("out").textContent = ["intensity", "width", "decay", "floor", "every", "phase"].map(id => `--${id} ${s[id]}`)
    .concat(s.kick ? "--kick" : "--no-kick").join(" ");
  if (rebuild) buildMask();
}
for (const id of ids) $(id).addEventListener("input", () => refresh(id === "width"));
$("copy").onclick = () => navigator.clipboard.writeText($("out").textContent).then(() => { $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy settings", 1200); });
$("reset").onclick = () => { for (const id of ids) { if ($(id).type === "checkbox") $(id).checked = defaults[id]; else $(id).value = defaults[id]; } refresh(true); };

for (const [t, title] of DATA.chapters) {
  const b = document.createElement("button"); b.textContent = title || t.toFixed(1) + " s";
  b.onclick = () => { v.currentTime = t; v.play(); };
  $("jumps").appendChild(b);
}
refresh(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
