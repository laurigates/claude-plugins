# Vale config for the house prose rubric.
#
# Canonical rubric: ~/.claude/rules/communication.md (chezmoi source
# laurigates/dotfiles → exact_dot_claude/rules/communication.md). The House rules
# beside this file are a DERIVED ENCODING of it, not a second source of truth —
# each carries a `link:` back to the rule that owns its criterion, and
# scripts/check-prose-house-style.sh asserts the derived copy has not drifted.
#
# Invoke through prose-plugin:prose-check's scripts/prose-check.sh, which passes
# --config explicitly. Nothing auto-discovers this file.
#
# The third-party rules below are a CURATED ALLOWLIST, cherry-picked by naming
# each rule with a level rather than loading its whole style through
# BasedOnStyles. Loading write-good wholesale produced 37 E-Prime alerts out of
# 47 total on communication.md — 79% noise from one rule. Add a rule here only
# when it maps to a criterion the rubric actually states.
StylesPath = .
MinAlertLevel = suggestion
Packages = write-good, proselint

[*.{md,markdown,txt}]
BasedOnStyles = House

# --- write-good: cherry-picked ---
write-good.Weasel = suggestion     # hedge/filler adverbs — House Hedge/Filler
write-good.TooWordy = suggestion   # verbose phrases — prose-distill levels 1, 7
write-good.So = suggestion         # sentence-opening "So," — throat-clearing
write-good.ThereIs = suggestion    # "There is/are" opener — throat-clearing
write-good.Illusions = warning     # duplicated words — a straight defect
write-good.Cliches = warning       # stock phrases — the aphorism tic's raw material

# E-Prime flags every form of "to be". Measured at 37/47 alerts on
# communication.md; it encodes a style the rubric does not ask for. Explicitly
# off, and pinned off by scripts/check-prose-house-style.sh.
write-good.E-Prime = NO
# Passive voice is legitimate in technical prose ("the handle was left unbound")
# and the rubric never bans it. Deliberately not in the allowlist.
write-good.Passive = NO

# --- proselint: cherry-picked ---
proselint.Cliches = warning        # aphorism / general maxim
proselint.Hedging = suggestion     # House Hedge
proselint.Hyperbole = warning      # neutral register — ticket-drafting-guidelines
proselint.CorporateSpeak = warning # neutral register
proselint.Jargon = suggestion      # throat-clearing corporate filler
proselint.Very = suggestion        # House Filler
proselint.Apologizing = warning    # "Lead with the answer" — no preamble
proselint.Annotations = error      # TODO/FIXME left in shipped prose
proselint.RASSyndrome = suggestion # redundancy — prose-distill level 1
proselint.Uncomparables = suggestion
proselint.Nonwords = suggestion
proselint.Oxymorons = suggestion
proselint.Malapropisms = suggestion
proselint.Archaisms = suggestion
proselint.GenderBias = warning     # they/them default for unstated pronouns
