# Offline fallback config: House rules only, no downloaded packages.
#
# `.vale.ini` beside this file declares `Packages = write-good, proselint`, which
# vale fetches over the network on `vale sync`. When those packages are absent
# and cannot be fetched, vale exits non-zero rather than running the rules it
# does have. prose-check.sh falls back to this config so the House layer — the
# part that encodes the actual rubric — still runs offline.
#
# Keep the House section identical to .vale.ini. The third-party allowlist lives
# only in .vale.ini; there is nothing to mirror here.
StylesPath = .
MinAlertLevel = suggestion

[*.{md,markdown,txt}]
BasedOnStyles = House
